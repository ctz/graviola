[package]
name = "rustls-graviola"
version = "0.4.0"
edition = "2024"
repository = "https://github.com/ctz/graviola/"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "graviola is a modern, fast cryptography library"
categories = ["network-programming", "cryptography"]
rust-version = "1.85"
readme = "README.md"

[dependencies]
graviola = { version = "0.4.0", path = "../graviola" }
rustls = { version = "=0.24.0-dev.3", default-features = false, features = ["std"] }

[dev-dependencies]
env_logger = "0.11"
http = "1"
rustls = { version = "=0.24.0-dev.3", features = ["webpki"] }
rustls-aws-lc-rs = { version = "=0.24.0-dev.3" }
rustls-ring = { version = "=0.24.0-dev.3" }
rustls-util = { version = "=0.24.0-dev.3" }
webpki-roots = "1"

[features]
default = []
