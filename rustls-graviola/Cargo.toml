[package]
name = "rustls-graviola"
version = "0.4.0"
edition = "2024"
repository = "https://github.com/ctz/graviola/"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "graviola is a modern, fast cryptography library"
categories = ["network-programming", "cryptography"]
rust-version = "1.85"
readme = "README.md"

[dependencies]
graviola = { version = "0.4.0", path = "../graviola" }
rustls = { git = "https://github.com/rustls/rustls", branch = "jbp-encrypt-interface-sketch", default-features = false }

[dev-dependencies]
env_logger = "0.11"
http = "1"
rustls = { git = "https://github.com/rustls/rustls", branch = "jbp-encrypt-interface-sketch", features = ["webpki"] }
rustls-aws-lc-rs = { git = "https://github.com/rustls/rustls", branch = "jbp-encrypt-interface-sketch" }
rustls-ring = { git = "https://github.com/rustls/rustls", branch = "jbp-encrypt-interface-sketch" }
rustls-util = { git = "https://github.com/rustls/rustls", branch = "jbp-encrypt-interface-sketch" }
webpki-roots = "1"

[features]
default = []
